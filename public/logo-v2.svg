<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f1624"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#e040fb"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#e040fb"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="400" height="400" rx="80" fill="url(#bgGrad)"/>

  <!-- Glowing gradient border -->
  <rect width="400" height="400" rx="80" fill="none"
        stroke="url(#brandGrad)" stroke-width="6"
        filter="url(#borderGlow)" opacity="0.6"/>
  <rect width="400" height="400" rx="80" fill="none"
        stroke="url(#brandGrad)" stroke-width="2" opacity="0.8"/>

  <!-- Ambient orb glow behind bolt -->
  <circle cx="200" cy="200" r="120" fill="url(#brandGrad)" opacity="0.07"/>

  <!-- Lightning bolt — centered, bold -->
  <polygon
    points="230,60 120,210 175,210 170,340 280,190 225,190"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />
  <!-- Bolt crisp layer on top -->
  <polygon
    points="230,60 120,210 175,210 170,340 280,190 225,190"
    fill="url(#boltGrad)"
    opacity="0.9"
  />
</svg>
